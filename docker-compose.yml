name: h3-zoom-test

services:
  postgresql:
    container_name: h3-zoom-test-postgresql
    restart: unless-stopped
    image: postgres:18-alpine
    ports:
      - '${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./docker/volumes/postgresql:/var/lib/postgresql

  redis:
    container_name: h3-zoom-test-redis
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - ./docker/volumes/redis:/data
    command:
      - redis-server
      - --user
      - ${REDIS_USER}
      - 'on'
      - '>${REDIS_PASSWORD}'
      - '~*'
      - '&*'
      - '+@all'
