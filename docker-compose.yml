name: h3-zoom-test

services:
  postgresql:
    container_name: h3-zoom-test-postgresql
    restart: unless-stopped
    image: postgres:18-alpine
    ports:
      - '${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${DB_USER:-rafiandria23}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-rafiandria23}
      POSTGRES_DB: ${DB_NAME:-h3_zoom_test}
    volumes:
      - ./docker/volumes/postgresql:/var/lib/postgresql
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${DB_USER:-rafiandria23} -d ${DB_NAME:-h3_zoom_test}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    container_name: h3-zoom-test-redis
    restart: unless-stopped
    image: redis:7-alpine
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - ./docker/volumes/redis:/data
    command:
      - redis-server
      - --user
      - ${REDIS_USER:-rafiandria23}
      - 'on'
      - '>${REDIS_PASSWORD:-rafiandria23}'
      - '~*'
      - '&*'
      - '+@all'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: apply apps/api/prisma/schema.prisma to the database, then exit.
  # `api` waits for this to complete successfully before starting.
  migrate:
    container_name: h3-zoom-test-migrate
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    restart: 'no'
    depends_on:
      postgresql:
        condition: service_healthy
    command:
      - yarn
      - nx
      - run
      - '@rafiandria23/h3-zoom-test-api:prisma'
      - '--'
      - db
      - push
      - --accept-data-loss
    environment:
      NODE_ENV: production
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_USER: ${DB_USER:-rafiandria23}
      DB_PASSWORD: ${DB_PASSWORD:-rafiandria23}
      DB_NAME: ${DB_NAME:-h3_zoom_test}

  api:
    container_name: h3-zoom-test-api
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - '${API_PORT:-3000}:${API_PORT:-3000}'
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # API_HOST stays 0.0.0.0 so Docker can forward the published port in;
      # API_PORT tracks the single knob.
      API_HOST: 0.0.0.0
      API_PORT: ${API_PORT:-3000}
      # Browser origin of the web app — used for the CORS allowlist.
      WEB_SCHEME: ${WEB_SCHEME:-http}
      WEB_HOST: ${WEB_HOST:-127.0.0.1}
      WEB_PORT: ${WEB_PORT:-4000}
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_USER: ${DB_USER:-rafiandria23}
      DB_PASSWORD: ${DB_PASSWORD:-rafiandria23}
      DB_NAME: ${DB_NAME:-h3_zoom_test}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USER: ${REDIS_USER:-rafiandria23}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-rafiandria23}
      REDIS_DB_INDEX: ${REDIS_DB_INDEX:-0}
    volumes:
      - ./docker/volumes/uploads:/app/uploads
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:${API_PORT:-3000}/api/v1').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    container_name: h3-zoom-test-web
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Inlined into the client bundle at build time — must be reachable from
        # the browser, not an internal compose hostname.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:${API_PORT:-3000}}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-4000}:${WEB_PORT:-4000}'
    environment:
      NODE_ENV: production
      # Next's standalone server (node apps/web/server.js) reads PORT + HOSTNAME.
      # PORT tracks WEB_PORT. HOSTNAME stays 0.0.0.0 so Docker can forward the
      # published port into the container — WEB_HOST (127.0.0.1) is only the
      # browser-facing address used for URLs and the API CORS allowlist.
      PORT: ${WEB_PORT:-4000}
      HOSTNAME: 0.0.0.0
